version: "3.9"

services:

  api:
    build: .
    container_name: rt-dto-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://user:pass@postgres:5432/rtdto
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=10
      - TASK_TIMEOUT_SECONDS=30
      - MAX_RETRIES=3
      - APP_ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python worker_entrypoint.py
    environment:
      - DATABASE_URL=postgresql+psycopg://user:pass@postgres:5432/rtdto
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=10
      - TASK_TIMEOUT_SECONDS=30
      - MAX_RETRIES=3
      - APP_ENV=production
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 3

  postgres:
    image: postgres:15-alpine
    container_name: rt-dto-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: rtdto
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rtdto"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rt-dto-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data: